<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ami.b</title>
<link rel="stylesheet" href="css/blocky.css">
<!-- Libraries are kept in assets/vendor/ (dexie 4.0.11, onnxruntime-web 1.17.0): nothing is fetched from another site -->
<script src="assets/vendor/dexie.min.js"></script>
<script src="assets/vendor/ort/ort.min.js"></script>
<script>ort.env.wasm.wasmPaths = 'assets/vendor/ort/'; ort.env.wasm.numThreads = 1;</script>
</head>
<body>

<!-- ── Start Gate ── -->
<div id="start-gate">
  <div id="start-label">tap to wake blocky</div>
</div>

<!-- ── Face Screen ── -->
<div id="screen-wrap">
  <canvas id="face"></canvas>
  <button id="theme-toggle" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>
</div>

<!-- ── Dev FAB ── -->
<button id="dev-fab" aria-label="Toggle dev panel">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 20V10M18 20V4M6 20v-4"/>
  </svg>
</button>

<!-- ── Dev Panel ── -->
<div id="sheet">
  <div id="sheet-handle"><div class="handle-bar"></div></div>
  <div id="sheet-content">

    <!-- Status -->
    <div class="dev-section">
      <div class="dev-row">
        <span class="dev-label">mood</span>
        <span class="dev-value" id="out-mood">calm</span>
      </div>
      <div class="dev-row">
        <span class="dev-label">mode</span>
        <span class="dev-value" id="out-mode">presence</span>
      </div>
    </div>

    <!-- Reactions -->
    <details class="dev-section" open>
      <summary class="dev-heading">Reactions</summary>
      <div id="reaction-log"></div>
    </details>

    <!-- Transcript -->
    <details class="dev-section" open>
      <summary class="dev-heading">Transcript</summary>
      <div id="transcript-box">waiting for speech...</div>
    </details>

    <!-- Sensors -->
    <details class="dev-section" open>
      <summary class="dev-heading">Sensors</summary>
      <div id="sensor-output"></div>
    </details>

    <!-- Faces -->
    <details class="dev-section" open>
      <summary class="dev-heading">Faces</summary>
      <div id="face-output"></div>
    </details>

    <!-- Companion State -->
    <details class="dev-section">
      <summary class="dev-heading">Companion State</summary>
      <div id="state-output"></div>
    </details>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
