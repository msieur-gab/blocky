<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ami.b — Eye Geometry Workbench</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f5f5f0;
  color: #1a1a1a;
  font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif;
  display: grid;
  grid-template-columns: 1fr minmax(340px, 420px);
  height: 100vh;
}

#preview { display: flex; align-items: center; justify-content: center; background: #0a0a0f; }
canvas { width: 92%; height: 70vh; background: #0a0a0f; }

#controls {
  background: #fff;
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  border-left: 2px solid #e0e0e0;
}

h2 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: #999;
  margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #eee;
}
h2:first-child { margin-top: 0; }

.row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.row label { width: 55px; font-size: 12px; color: #555; flex-shrink: 0; }
.row input[type="range"] { flex: 1; height: 5px; accent-color: #3b82f6; cursor: pointer; }
.row .v { width: 36px; text-align: right; font-size: 12px; font-weight: 600; color: #3b82f6; }

/* Corner radius */
.corners { margin-bottom: 6px; }
.corners .row label { width: 55px; }

.toggle { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.toggle label { font-size: 12px; color: #555; }
.toggle input { width: 16px; height: 16px; }

#presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
#presets button {
  padding: 5px 10px; font-size: 11px; font-family: inherit;
  background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 5px; cursor: pointer;
}
#presets button:hover { border-color: #3b82f6; color: #3b82f6; }
#presets button.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }

.actions { display: flex; gap: 6px; margin: 10px 0; }
.actions button {
  flex: 1; padding: 7px; font-size: 12px; font-family: inherit;
  background: #3b82f6; color: #fff; border: none; border-radius: 5px; cursor: pointer;
}
.actions button.sec { background: #f0f0f0; color: #333; border: 1px solid #ddd; }

#out {
  background: #f8f8f8; padding: 8px; border-radius: 5px;
  font: 11px/1.3 'SF Mono', monospace; color: #666;
  white-space: pre-wrap; max-height: 100px; overflow-y: auto; border: 1px solid #eee;
}

.tab-bar { display: flex; gap: 2px; margin-bottom: 8px; }
.tab-bar button {
  flex: 1; padding: 6px; font-size: 11px; font-family: inherit;
  background: #f0f0f0; color: #666; border: 1px solid #ddd; border-radius: 5px 5px 0 0; cursor: pointer;
}
.tab-bar button.on { background: #fff; color: #1a1a1a; border-bottom-color: #fff; font-weight: 600; }
.tab-content { display: none; }
.tab-content.on { display: block; }
</style>
</head>
<body>

<div id="preview"><canvas id="c"></canvas></div>

<div id="controls">

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="on" onclick="showTab('left')">Left Eye</button>
    <button onclick="showTab('right')">Right Eye</button>
    <button onclick="showTab('gaze')">Gaze / Head</button>
    <button onclick="showTab('life')">Micro-Life</button>
  </div>

  <!-- LEFT EYE -->
  <div id="tab-left" class="tab-content on">
    <h2>Size</h2>
    <div id="sl-lsize"></div>
    <h2>Shift (top/bottom half)</h2>
    <div id="sl-lshift"></div>
    <h2>Corner Radii</h2>
    <div class="corners" id="sl-lcorners"></div>
    <h2>Transform</h2>
    <div id="sl-ltransform"></div>
    <div class="toggle">
      <input type="checkbox" id="mirror" checked>
      <label for="mirror">Mirror to Right Eye</label>
    </div>
  </div>

  <!-- RIGHT EYE -->
  <div id="tab-right" class="tab-content">
    <h2>Size</h2>
    <div id="sl-rsize"></div>
    <h2>Shift (top/bottom half)</h2>
    <div id="sl-rshift"></div>
    <h2>Corner Radii</h2>
    <div class="corners" id="sl-rcorners"></div>
    <h2>Transform</h2>
    <div id="sl-rtransform"></div>
  </div>

  <!-- GAZE / HEAD -->
  <div id="tab-gaze" class="tab-content">
    <h2>Gaze (moves both eyes)</h2>
    <div id="sl-gaze"></div>
    <div class="toggle">
      <input type="checkbox" id="auto-gaze" checked>
      <label for="auto-gaze">Auto wander</label>
    </div>
    <h2>Head</h2>
    <div id="sl-head"></div>
    <h2>Eye Gap</h2>
    <div id="sl-gap"></div>
  </div>

  <!-- MICRO-LIFE -->
  <div id="tab-life" class="tab-content">
    <h2>Breathing</h2>
    <div id="sl-breath"></div>
    <h2>Gaze Drift</h2>
    <div id="sl-drift"></div>
  </div>

  <h2>Presets</h2>
  <div id="presets"></div>

  <div class="actions">
    <button onclick="copyJSON()">Copy JSON</button>
    <button class="sec" onclick="resetAll()">Reset</button>
  </div>
  <div id="out"></div>
</div>

<script>
// ══════════════════════════════════════════
// State — per-eye with 4 independent corner radii
// ══════════════════════════════════════════

// All values match Figma coordinate space:
// w/h = full width/height, radii = Figma corner radius, gap = center-to-center
const D = {
  // Left eye
  lw: 100, lh: 200,
  ltl: 50, ltr: 50, lbr: 50, lbl: 50,
  lshiftTop: 0, lshiftBot: 0,
  lrot: 0, lx: 0, ly: 0, lskewX: 0, lskewY: 0,

  // Right eye
  rw: 100, rh: 200,
  rtl: 50, rtr: 50, rbr: 50, rbl: 50,
  rshiftTop: 0, rshiftBot: 0,
  rrot: 0, rx: 0, ry: 0, rskewX: 0, rskewY: 0,

  // Gaze
  gazeX: 0, gazeY: 0,
  // Head
  headTilt: 0, headX: 0, headY: 0, headScale: 1.0,
  // Gap
  gap: 400,
  // Micro-life
  breathAmp: 2, driftAmp: 1.5, driftSpeed: 0.8,
};

const S = { ...D };

// ══════════════════════════════════════════
// Slider definitions
// ══════════════════════════════════════════

const SL = {
  lsize:      [{ k:'lw', l:'width', mn:10, mx:200 }, { k:'lh', l:'height', mn:10, mx:300 }],
  lshift:     [{ k:'lshiftTop', l:'top', mn:-80, mx:80 }, { k:'lshiftBot', l:'bottom', mn:-80, mx:80 }],
  lcorners:   [{ k:'ltl', l:'TL', mn:0, mx:100 }, { k:'ltr', l:'TR', mn:0, mx:100 }, { k:'lbl', l:'BL', mn:0, mx:100 }, { k:'lbr', l:'BR', mn:0, mx:100 }],
  ltransform: [{ k:'lrot', l:'rotate', mn:-45, mx:45 }, { k:'lx', l:'x', mn:-60, mx:60 }, { k:'ly', l:'y', mn:-80, mx:80 }, { k:'lskewX', l:'skewX', mn:-50, mx:50, sc:0.01 }, { k:'lskewY', l:'skewY', mn:-50, mx:50, sc:0.01 }],

  rsize:      [{ k:'rw', l:'width', mn:10, mx:200 }, { k:'rh', l:'height', mn:10, mx:300 }],
  rshift:     [{ k:'rshiftTop', l:'top', mn:-80, mx:80 }, { k:'rshiftBot', l:'bottom', mn:-80, mx:80 }],
  rcorners:   [{ k:'rtl', l:'TL', mn:0, mx:100 }, { k:'rtr', l:'TR', mn:0, mx:100 }, { k:'rbl', l:'BL', mn:0, mx:100 }, { k:'rbr', l:'BR', mn:0, mx:100 }],
  rtransform: [{ k:'rrot', l:'rotate', mn:-45, mx:45 }, { k:'rx', l:'x', mn:-60, mx:60 }, { k:'ry', l:'y', mn:-80, mx:80 }, { k:'rskewX', l:'skewX', mn:-50, mx:50, sc:0.01 }, { k:'rskewY', l:'skewY', mn:-50, mx:50, sc:0.01 }],

  gaze:  [{ k:'gazeX', l:'X', mn:-100, mx:100, sc:0.01 }, { k:'gazeY', l:'Y', mn:-100, mx:100, sc:0.01 }],
  head:  [{ k:'headTilt', l:'tilt', mn:-30, mx:30 }, { k:'headX', l:'x', mn:-80, mx:80 }, { k:'headY', l:'y', mn:-80, mx:80 }, { k:'headScale', l:'scale', mn:50, mx:150, sc:0.01 }],
  gap:   [{ k:'gap', l:'gap', mn:150, mx:700, st:10 }],
  breath:[{ k:'breathAmp', l:'amplitude', mn:0, mx:8, st:0.5 }],
  drift: [{ k:'driftAmp', l:'amplitude', mn:0, mx:5, st:0.5 }, { k:'driftSpeed', l:'speed', mn:0, mx:3, st:0.1 }],
};

// ══════════════════════════════════════════
// Presets — from Figma reference
// ══════════════════════════════════════════

// Presets in Figma coordinates (w:100, h:200, radii:50, gap:400 = default)
// Only override what differs from default
const P = {
  calm:       {},
  attentive:  { lrot: 3, rrot: -5, lh: 190, rh: 190 },
  worried:    { lw: 75, lh: 140, rw: 75, rh: 140, ltl: 20, ltr: 25, rtl: 25, rtr: 20, lbl: 35, lbr: 35, rbl: 35, rbr: 35 },
  curious:    { lw: 110, lh: 220, rw: 85, rh: 170, lrot: -8, rrot: 12, ltl: 50, lbl: 35, rtl: 30, rtr: 40, headTilt: 8 },
  happy:      { lh: 150, rh: 150, ltl: 30, ltr: 30, rtl: 30, rtr: 30, lbl: 50, lbr: 50, rbl: 50, rbr: 50 },
  sleepy:     { lh: 40, rh: 40, lw: 120, rw: 120, ltl: 15, ltr: 15, rtl: 15, rtr: 15, lbl: 15, lbr: 15, rbl: 15, rbr: 15, ly: 10, ry: 10 },
  sad:        { lh: 170, rh: 170, ltl: 15, ltr: 30, rtl: 30, rtr: 15, lbl: 50, lbr: 40, rbl: 40, rbr: 50, lrot: 10, rrot: -10, ly: 10, ry: 10 },
  silly:      { lw: 105, lh: 185, rw: 95, rh: 160, ltl: 50, ltr: 30, rtl: 35, rtr: 50, lbl: 30, lbr: 50, rbl: 50, rbr: 30, lrot: 12, rrot: -8 },
  angry:      { lh: 120, rh: 120, lw: 110, rw: 110, ltl: 8, ltr: 30, rtl: 30, rtr: 8, lbl: 35, lbr: 35, rbl: 35, rbr: 35, lrot: -15, rrot: 15 },
  excited:    { lw: 120, lh: 230, rw: 120, rh: 230, gap: 440 },
  surprise:   { lw: 130, lh: 240, rw: 130, rh: 240, gap: 460 },
  scared:     { lw: 115, lh: 250, rw: 115, rh: 250, gap: 480 },
  love:       { lh: 160, rh: 160, lw: 110, rw: 110, lrot: 8, rrot: -8 },
  suspicious: { lh: 60, rh: 70, lw: 115, rw: 110, ltl: 8, ltr: 15, rtl: 15, rtr: 8, lbl: 15, lbr: 8, rbl: 8, rbr: 15, lrot: -3, rrot: 5 },
  thinking:   { lw: 85, lh: 170, rw: 100, rh: 205, lrot: 0, rrot: 5, headTilt: 10, gazeX: 0.5, gazeY: -0.3 },
  determined: { lh: 130, rh: 130, lw: 105, rw: 105, ltl: 8, ltr: 25, rtl: 25, rtr: 8, lbl: 30, lbr: 30, rbl: 30, rbr: 30, lrot: -8, rrot: 8 },
  wink:       { lh: 20, lw: 100, ltl: 8, ltr: 8, lbl: 8, lbr: 8, rh: 210, rw: 105 },
  bored:      { lh: 70, rh: 70, ltl: 20, ltr: 20, rtl: 20, rtr: 20, ly: 16, ry: 16 },
};

// ══════════════════════════════════════════
// Canvas
// ══════════════════════════════════════════

const c = document.getElementById('c');
const x = c.getContext('2d');
let W, H, cx, cy, sc, t = 0;

function resize() {
  const d = devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  W = r.width || 600; H = r.height || 400;
  c.width = W * d; c.height = H * d;
  x.setTransform(d, 0, 0, d, 0, 0);
  cx = W / 2; cy = H / 2; sc = Math.min(W, H) / 560;
}

// ── Blink system ──
let blinkAmt = 0;       // 0 = open, 1 = closed
let blinkPhase = 0;     // 0 = waiting, 1 = closing, 2 = opening
let blinkTimer = 2 + Math.random() * 3;
let blinksLeft = 0;
let blinkPause = 0;
let blinkOffset = 0;    // asymmetric: right eye delay in frames

function updateBlink(dt) {
  if (blinkPhase === 0) {
    if (blinkPause > 0) {
      blinkPause -= dt;
      if (blinkPause <= 0) blinkPhase = 1;
    } else {
      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        // Decide blink type
        const roll = Math.random();
        if (roll < 0.55) {
          blinksLeft = 1;                        // single
          blinkOffset = 0;
        } else if (roll < 0.80) {
          blinksLeft = 2;                        // double fast
          blinkOffset = 0;
        } else if (roll < 0.92) {
          blinksLeft = 3;                        // triple nervous
          blinkOffset = 0;
        } else {
          blinksLeft = 1;                        // asymmetric
          blinkOffset = 0.04 + Math.random() * 0.03;
        }
        blinkPhase = 1;
      }
    }
  }

  const isMulti = blinksLeft > 1;
  const closeSpd = isMulti ? 28 : 14;
  const openSpd = isMulti ? 22 : 10;

  if (blinkPhase === 1) {
    blinkAmt = Math.min(1, blinkAmt + dt * closeSpd);
    if (blinkAmt >= 1) blinkPhase = 2;
  } else if (blinkPhase === 2) {
    blinkAmt = Math.max(0, blinkAmt - dt * openSpd);
    if (blinkAmt <= 0) {
      blinkAmt = 0;
      blinkPhase = 0;
      blinksLeft--;
      if (blinksLeft > 0) {
        blinkPause = 0.04 + Math.random() * 0.04;
      } else {
        blinkTimer = 2 + Math.random() * 4;
        blinkOffset = 0;
      }
    }
  }
}

function getBlinkScale(isRight) {
  // Asymmetric: right eye slightly delayed
  if (isRight && blinkOffset > 0) {
    return Math.max(0.08, 1 - Math.max(0, blinkAmt - blinkOffset / 0.1) * 0.95);
  }
  return Math.max(0.08, 1 - blinkAmt * 0.95);
}

function draw() {
  const dt = 0.016;
  t += dt;
  updateBlink(dt);

  x.clearRect(0, 0, W, H);
  x.fillStyle = '#0a0a0f';
  x.fillRect(0, 0, W, H);

  const breath = Math.sin(t * 1.2) * S.breathAmp * sc;
  const ag = document.getElementById('auto-gaze').checked;
  const dx = ag ? Math.sin(t * S.driftSpeed) * S.driftAmp * sc : 0;
  const dy = ag ? Math.sin(t * S.driftSpeed * 0.7 + 1.3) * S.driftAmp * 0.5 * sc : 0;

  // Gaze container
  x.save();
  x.translate(cx + S.headX * sc, cy + S.headY * sc + breath);
  x.rotate(S.headTilt * Math.PI / 180);
  x.scale(S.headScale, S.headScale);

  const gx = S.gazeX * 15 * sc + dx;
  const gy = S.gazeY * 10 * sc + dy;
  const gap = S.gap * sc / 2;
  const mir = document.getElementById('mirror').checked;

  const blinkL = getBlinkScale(false);
  const blinkR = getBlinkScale(true);

  // Left eye
  drawEye(-gap, S.lw, S.lh, S.ltl, S.ltr, S.lbr, S.lbl, S.lrot, S.lx, S.ly, S.lskewX, S.lskewY, gx, gy, blinkL, S.lshiftTop, S.lshiftBot);

  // Right eye — mirror negates shifts
  if (mir) {
    drawEye(gap, S.lw, S.lh, S.ltr, S.ltl, S.lbl, S.lbr, -S.lrot, -S.lx, S.ly, -S.lskewX, -S.lskewY, gx, gy, blinkR, -S.lshiftTop, -S.lshiftBot);
  } else {
    drawEye(gap, S.rw, S.rh, S.rtl, S.rtr, S.rbr, S.rbl, S.rrot, S.rx, S.ry, S.rskewX, S.rskewY, gx, gy, blinkR, S.rshiftTop, S.rshiftBot);
  }

  x.restore();
  requestAnimationFrame(draw);
}

function drawEye(baseX, w, h, tl, tr, br, bl, rot, ox, oy, skX, skY, gx, gy, blinkScale, shiftTop, shiftBot) {
  const ew = w * sc / 2;
  const rawEh = h * sc / 2;
  // Skip blink when eyes already nearly closed (sleeping)
  const eyeTiny = rawEh < 8 * sc;
  const bs = eyeTiny ? 1 : (blinkScale || 1);
  const eh = Math.max(1.5 * sc, rawEh * bs);
  const st = (shiftTop || 0) * sc / 2;
  const sb = (shiftBot || 0) * sc / 2;
  // Clamp radii against rendered half-dimensions
  const ctl = Math.min(tl * sc, ew, eh);
  const ctr = Math.min(tr * sc, ew, eh);
  const cbr = Math.min(br * sc, ew, eh);
  const cbl = Math.min(bl * sc, ew, eh);

  x.save();
  x.translate(baseX + ox * sc + gx, (oy) * sc + gy);
  x.rotate(rot * Math.PI / 180);

  // Skew
  if (skX || skY) x.transform(1, skY, skX, 1, 0, 0);

  x.fillStyle = '#d7d0c8';

  // Eyes too thin for pill — draw a line (blink or squished expression)
  if ((!eyeTiny && blinkScale !== undefined && blinkScale < 0.12) || eh < ew * 0.15) {
    x.strokeStyle = '#d7d0c8';
    x.lineWidth = 2.5 * sc;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(-ew * 0.75, 0);
    x.lineTo(ew * 0.75, 0);
    x.stroke();
    x.restore();
    return;
  }

  x.beginPath();
  x.moveTo(st, -eh);
  x.arcTo( ew + st, -eh,  ew + sb,  eh, ctr);
  x.arcTo( ew + sb,  eh, -ew + sb,  eh, cbr);
  x.arcTo(-ew + sb,  eh, -ew + st, -eh, cbl);
  x.arcTo(-ew + st, -eh,  ew + st, -eh, ctl);
  x.closePath();
  x.fill();
  x.restore();
}

// ══════════════════════════════════════════
// UI
// ══════════════════════════════════════════

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('on'));
  document.getElementById('tab-' + name).classList.add('on');
  event.target.classList.add('on');
}

function buildSl(id, defs) {
  const el = document.getElementById('sl-' + id);
  el.innerHTML = '';
  defs.forEach(d => {
    const s = d.sc || 1;
    const st = d.st || 1;
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<label>${d.l}</label><input type="range" min="${d.mn}" max="${d.mx}" step="${st}" value="${s!==1?S[d.k]/s:S[d.k]}"><span class="v">${s!==1?S[d.k].toFixed(2):S[d.k]}</span>`;
    const inp = div.querySelector('input');
    const v = div.querySelector('.v');
    inp.oninput = () => { S[d.k] = parseFloat(inp.value) * s; v.textContent = s!==1?S[d.k].toFixed(2):S[d.k]; };
    el.appendChild(div);
  });
}

function buildAll() {
  Object.keys(SL).forEach(id => buildSl(id, SL[id]));
}

function buildPresets() {
  const el = document.getElementById('presets');
  el.innerHTML = '';
  Object.keys(P).forEach(n => {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => {
      Object.assign(S, D, P[n]);
      // Mirror right from left if mirror is on and preset only defines left
      if (document.getElementById('mirror').checked) {
        ['rw','rh','rtl','rtr','rbr','rbl','rrot','rx','ry','rskewX','rskewY'].forEach(k => {
          if (P[n][k] === undefined) S[k] = D[k];
        });
      }
      buildAll();
      el.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    };
    el.appendChild(b);
  });
}

function resetAll() {
  Object.assign(S, D);
  buildAll();
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
}

function copyJSON() {
  // Export as expressions.js format
  const mir = document.getElementById('mirror').checked;
  const mapEye = (prefix) => {
    const e = {};
    const pk = (k) => S[prefix + k];
    if (pk('w') !== D[prefix+'w']) e.w = pk('w');
    if (pk('h') !== D[prefix+'h']) e.h = pk('h');
    if (pk('tl') !== D[prefix+'tl']) e.tl = pk('tl');
    if (pk('tr') !== D[prefix+'tr']) e.tr = pk('tr');
    if (pk('bl') !== D[prefix+'bl']) e.bl = pk('bl');
    if (pk('br') !== D[prefix+'br']) e.br = pk('br');
    if (pk('shiftTop') !== D[prefix+'shiftTop']) e.shiftTop = pk('shiftTop');
    if (pk('shiftBot') !== D[prefix+'shiftBot']) e.shiftBot = pk('shiftBot');
    if (pk('rot') !== D[prefix+'rot']) e.tilt = pk('rot');
    if (pk('x') !== D[prefix+'x']) e.x = pk('x');
    if (pk('y') !== D[prefix+'y']) e.y = pk('y');
    return Object.keys(e).length ? e : null;
  };

  const left = mapEye('l');
  const right = mir ? null : mapEye('r');
  const face = {};
  if (S.headTilt !== D.headTilt) face.tilt = S.headTilt;
  if (S.headX !== D.headX) face.x = S.headX;
  if (S.headY !== D.headY) face.y = S.headY;
  if (S.headScale !== D.headScale) face.scale = S.headScale;

  let out = '';
  if (mir && left) {
    out = `sym(\n  ${JSON.stringify(left)},\n  { /* mouth */ },\n  ${Object.keys(face).length ? JSON.stringify(face) : '{}'}${S.gap !== D.gap ? ',\n  ' + S.gap : ''}\n)`;
  } else if (left || right) {
    out = `asym(\n  ${JSON.stringify(left || {})},\n  ${JSON.stringify(right || {})},\n  { /* mouth */ },\n  ${Object.keys(face).length ? JSON.stringify(face) : '{}'}${S.gap !== D.gap ? ',\n  ' + S.gap : ''}\n)`;
  } else {
    out = `sym({}, {}, {})`;
  }

  navigator.clipboard.writeText(out).then(() => { document.getElementById('out').textContent = 'Copied!\n' + out; });
}

// Init
window.addEventListener('resize', resize);
buildAll();
buildPresets();
requestAnimationFrame(() => { resize(); draw(); });
</script>
</body>
